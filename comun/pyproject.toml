[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schooldesk-comun"
version = "0.1.0"
description = "Código común a todos los servicios de SchoolDesk"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pyjwt>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["schooldesk_comun"]
